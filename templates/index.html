<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datei-Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-section {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .upload-section input[type="file"] {
            margin-bottom: 10px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-info {
            background-color: #17a2b8;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #666;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        form {
            display: inline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Datei-Manager</h1>

        <div class="upload-section">
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <br>
                <button type="submit" class="btn btn-primary">Hochladen</button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Dateiname</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                {% for file in files %}
                <tr>
                    <td>{{ file }}</td>
                    <td class="actions">
                        <a href="{{ url_for('view_file', filename=file) }}" target="_blank" class="btn btn-info">Ansehen</a>
                        <a href="{{ url_for('download_file', filename=file) }}" class="btn btn-success">Download</a>
                        <form action="{{ url_for('delete_file', filename=file) }}" method="post" onsubmit="return confirm('Wirklich löschen?');">
                            <button type="submit" class="btn btn-danger">Löschen</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                {% if not files %}
                <tr>
                    <td colspan="2" style="text-align: center; color: #999;">Keine Dateien vorhanden.</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>
